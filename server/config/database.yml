default: &default
  adapter: mysql2
  encoding: utf8mb4
  collation: utf8mb4_unicode_ci
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  username: <%= ENV["DB_USER"] %>
  password: <%= ENV["DB_PASSWORD"] %>
  host: <%= ENV["DB_HOST"] || "localhost" %>

development:
  <<: *default
  database: <%= ENV["DB_NAME"] || "spree_development" %>

test:
  <<: *default
  database: <%= ENV["DB_NAME"] ? "#{ENV['DB_NAME']}_test" : "spree_test" %>

production:
  primary: &primary_production
    <<: *default
    database: <%= ENV["DB_NAME"] %>
  cache:
    <<: *primary_production
    database: <%= "#{ENV['DB_NAME']}_cache" %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: <%= "#{ENV['DB_NAME']}_queue" %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: <%= "#{ENV['DB_NAME']}_cable" %>
    migrations_paths: db/cable_migrate
